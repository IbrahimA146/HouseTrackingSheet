<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3ba3e0">
<meta name="description" content="Monthly maneviyat competition tracker.">
<title>Maneviyat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div></div>


<!-- ======================= 1. PICK A HOUSE ======================= -->
<section id="screenHouse" class="screen" hidden>
  <div class="screen-inner">
    <div class="welcome">
      <div class="welcome-mark">☾</div>
      <h1>Maneviyat</h1>
      <p class="lede">Monthly competition</p>
    </div>
    <h2 class="step-label">Which house are you in?</h2>
    <div class="house-grid" id="houseGrid"></div>
    <p class="demo-note" id="demoNote" hidden>
      <strong>Demo mode.</strong> Firebase is not connected, so nothing is saved.
    </p>
  </div>
</section>


<!-- ======================= 2. PICK YOUR NAME ===================== -->
<section id="screenMember" class="screen" hidden>
  <div class="screen-inner">
    <button class="backbtn" data-back="house">&larr; Back</button>
    <h1 class="screen-title" id="memberHouseName"></h1>
    <p class="lede" id="memberHouseAddress"></p>
    <h2 class="step-label">Who are you?</h2>
    <div class="member-grid" id="memberGrid"></div>
  </div>
</section>


<!-- =========================== 3. APP =========================== -->
<div id="screenMain" hidden>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark">☾</span><span id="topHouse"></span></div>
      <div class="topbar-right">
        <span class="month-pill" id="monthPill"></span>
        <button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
        <button class="iconbtn" id="signOutBtn" aria-label="Switch person" title="Switch person">⇄</button>
      </div>
    </div>
  </header>

  <div class="banner" id="demoBanner" hidden>Demo mode. Nothing here is saved.</div>

  <nav class="tabbar" id="tabbar" role="tablist">
    <button class="tab is-active" data-tab="me"     role="tab"><span class="tab-ico">◍</span>Me</button>
    <button class="tab"           data-tab="house"  role="tab"><span class="tab-ico">⌂</span>House</button>
    <button class="tab"           data-tab="rank"   role="tab"><span class="tab-ico">✦</span>Score</button>
    <button class="tab"           data-tab="houses" role="tab"><span class="tab-ico">⊞</span>Houses</button>
  </nav>

  <main class="page">
    <div class="panel" id="panel-me"></div>
    <div class="panel" id="panel-house" hidden></div>
    <div class="panel" id="panel-rank" hidden></div>
    <div class="panel" id="panel-houses" hidden></div>
  </main>

</div>

<!-- celebration overlay, drawn on every successful log -->
<div id="celebrate" class="celebrate" hidden aria-hidden="true">
  <canvas id="celebrateCanvas"></canvas>
  <div class="celebrate-words" id="celebrateWords"></div>
  <div class="celebrate-core">
    <div class="celebrate-amount" id="celebrateAmount"></div>
    <div class="celebrate-label" id="celebrateLabel"></div>
    <div class="celebrate-tier" id="celebrateTier"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
